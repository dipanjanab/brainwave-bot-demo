fiscal_calendar:
  start_month: 4
  convention: "FY26 means 1 April 2025 through 31 March 2026"

terms:
  stories: submissions
  story: submission
  ideas: submissions
  idea: submission
  submit: submitted
  submitted: submitted
  nemia: EMIA
  emia: EMIA
  europe middle east and africa: EMIA
  europe middle east india and africa: EMIA
  europe, middle east, india and africa: EMIA
  north america: AMER
  amer: AMER
  america: AMER
  americas: AMER
  latin america: LATAM
  latam: LATAM
  asia pacific: APAC
  apac: APAC

metrics:
  submission_count:
    description: "Number of unique submitted ideas"
    aggregation: "COUNT(DISTINCT submission_id)"
  approved_submission_count:
    description: "Number of unique ideas whose status is Approved"
    aggregation: "COUNT(DISTINCT submission_id)"
    fixed_filters:
      status: Approved

dimensions:
  market: [EMIA, APAC, AMER, LATAM]
  status: [Submitted, Approved, Rejected]
