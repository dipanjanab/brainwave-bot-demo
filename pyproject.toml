[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brainwave-bot"
version = "0.1.0"
description = "Governed LangChain prototype for natural-language business analytics"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langchain-core>=0.3,<2",
  "numpy>=2,<3",
  "sqlglot>=26,<30",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "streamlit>=1.40,<2",
]

[project.scripts]
brainwave = "brainwave_bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
